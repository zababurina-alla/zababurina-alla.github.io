<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Бухгалтерия</title>
    <meta name="theme-color" content="#ECEEF1" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="icon" href="./icons/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="./icons/favicon-16.png" type="image/png" sizes="16x16" />
    <script>
      // Тема до первой отрисовки, чтобы не мигало: выбор пользователя → настройка системы. ?theme= — для скриншотов.
      (function () {
        var t = new URLSearchParams(location.search).get('theme');
        try { t = t || localStorage.getItem('sverka.theme'); } catch (e) {}
        if (t !== 'dark' && t !== 'light') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
