<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Борд «Бухгалтерии»</title>
<style>
:root{--bg:#f5f4f1;--ink:#15140f;--mut:#6b6a63;--card:#fff;--line:#e4e2dc;--acc:#2b6cff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0d0c;--ink:#f2f1ec;--mut:#9a998f;--card:#171715;--line:#2a2a27}}
:root[data-theme="dark"]{--bg:#0d0d0c;--ink:#f2f1ec;--mut:#9a998f;--card:#171715;--line:#2a2a27}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1280px;margin:0 auto;padding:24px 16px 112px}
h1{font-size:clamp(28px,4vw,44px);margin:8px 0 4px;letter-spacing:-.02em}
.sub{color:var(--mut);margin:0 0 16px;max-width:66ch}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,560px),1fr));gap:24px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card.sel{outline:3px solid var(--acc);outline-offset:2px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.head b{font-size:20px}.head small{display:block;color:var(--mut)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"],.card.sel .pick{background:var(--acc);border-color:var(--acc);color:#fff}
.frame{position:relative;aspect-ratio:16/10;overflow:hidden;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.frame iframe{position:absolute;left:0;top:0;width:1280px;height:800px;border:0;transform-origin:0 0;pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hint{color:var(--mut);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
<h1>Новый вид «Бухгалтерии»</h1>
<p class="sub">Ваши шаблоны A, B, C, F — теперь про бухгалтерию. Данные выдуманы. «Открыть» — живая страница: меню слева, «Сегодня» и «Клиенты», кнопка темы, звук после первого клика. Сузьте окно — увидите телефон.</p>
<div class="tabs" role="group" aria-label="Экран в превью">
<button class="btn" data-screen="today" aria-pressed="true">Сегодня</button>
<button class="btn" data-screen="clients" aria-pressed="false">Клиенты</button>
</div>
<div class="grid" id="grid"></div>
</div>
<div class="bar">
<div><b>Мой выбор:</b> <span id="pick">пока ничего</span></div>
<div class="hint">Можно смесь: «A по виду + C по теплу»</div>
</div>
<script>
const S=[["A","Тихий премиум","разлиновка учётной книги, воздух"],["B","Стекло","живой свет за стеклом"],["C","Живая бумага","листы, папки, голубь с квитанцией"],["F","Журнал","крупные суммы и даты, как афиша"]];
const grid=document.getElementById("grid"),picks=new Set();let screen="today";
function fit(f){const i=f.firstElementChild;i.style.transform="scale("+f.clientWidth/1280+")"}
function src(id){return id+"/index.html#"+screen}
S.forEach(([id,name,note])=>{
 const c=document.createElement("div");c.className="card";
 c.innerHTML=`<div class="head"><div><b>${id}. ${name}</b><small>${note}</small></div>
 <div class="row"><a class="btn open" href="${src(id)}" target="_blank" rel="noopener">Открыть</a><button class="btn pick">Выбрать</button></div></div>
 <div class="frame"><iframe src="${src(id)}" loading="lazy" title="${name}" tabindex="-1"></iframe></div>`;
 c.dataset.id=id;
 c.querySelector(".pick").onclick=e=>{picks.has(id)?picks.delete(id):picks.add(id);c.classList.toggle("sel",picks.has(id));
  e.target.textContent=picks.has(id)?"Выбрано ✓":"Выбрать";
  document.getElementById("pick").textContent=picks.size?[...picks].join(", "):"пока ничего"};
 grid.appendChild(c);
});
document.querySelectorAll("[data-screen]").forEach(b=>b.onclick=()=>{
 screen=b.dataset.screen;
 document.querySelectorAll("[data-screen]").forEach(x=>x.setAttribute("aria-pressed",x===b));
 document.querySelectorAll(".card").forEach(c=>{const id=c.dataset.id;c.querySelector("iframe").src=src(id);c.querySelector(".open").href=src(id)});
});
function fitAll(){document.querySelectorAll(".frame").forEach(fit)}
addEventListener("resize",fitAll);fitAll();
</script>
</body>
</html>
